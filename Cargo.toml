[package]
name = "implied-vol"
version = "2.1.0"
authors = ["Hikaru Nakashima <nakashima.alg57@gmail.com>"]
description = "Accurate, fast implied volatility and option pricing in pure Rust"
edition = "2024"
repository = "https://github.com/nakashima-hikaru/implied-vol"
license-file = "LICENSE"
keywords = ["finance"]
categories = ["finance"]

[features]
default = []
fma = []
flashiv = []
experimental = ["dep:fearless_simd"]
cxx_bench = ["cxx", "cxx-build"]

[dev-dependencies]
rand = "0.10.3"

[dependencies.fearless_simd]
# The numerical source certificate binds this backend version.
version = "=1.0.0"
optional = true

[dependencies.cxx]
version = "1.0.202"
optional = true

[build-dependencies.cxx-build]
version = "1.0.202"
optional = true

[lints.clippy]
pedantic = { level = "warn", priority = 1 }
#restriction = "warn"
cargo = { level = "warn", priority = 1 }
nursery = "warn"
inline_always = { level = "allow", priority = 2 }
float_cmp = { level = "allow", priority = 2 }
too_many_lines = { level = "allow", priority = 2 }
many_single_char_names = { level = "allow", priority = 2 }
similar_names = { level = "allow", priority = 2 }
neg_cmp_op_on_partial_ord = { level = "allow", priority = 2 } # for const fn
[profile.bench]
lto = true

[[bench]]
name = "implied_black_vol_paths"
harness = false
