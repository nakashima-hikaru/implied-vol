name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: base
            features: cxx_bench
          - mode: base-fma
            features: fma,cxx_bench
          - mode: flashiv
            features: flashiv,cxx_bench
          - mode: flashiv-fma
            features: flashiv,fma,cxx_bench
          - mode: experimental
            features: experimental,cxx_bench
          - mode: experimental-fma
            features: experimental,fma,cxx_bench
          - mode: combined
            features: flashiv,experimental,cxx_bench
          - mode: combined-fma
            features: flashiv,experimental,fma,cxx_bench
          - mode: volfi-book
            features: volfi_book,cxx_bench
          - mode: volfi-book-fma
            features: volfi_book,fma,cxx_bench
    name: Test ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install nextest
        shell: bash
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - run: cargo fmt --all --check
      - run: cargo check --workspace --features "${{ matrix.features }}"
      - run: cargo clippy --features "${{ matrix.features }}" -- -D warnings
      - run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo test --features "${{ matrix.features }}" --doc -- --show-output
      - run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo nextest run --features "${{ matrix.features }}"

  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Run benchmarks
        run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo +nightly bench --features cxx_bench
        env:
          RUSTFLAGS: --cfg=bench

      - name: Run benchmarks with FMA
        run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo +nightly bench --features fma,cxx_bench
        env:
          RUSTFLAGS: --cfg=bench

  hybrid-benchmarks:
    name: Compare Hybrid with LBR (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: crate-fma-off
            features: cxx_bench
          - mode: crate-fma-on
            features: fma,cxx_bench
    env:
      RUSTFLAGS: -C target-cpu=native -C target-feature=+fma
      CARGO_TARGET_DIR: target/solver-comparison
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Hybrid and LBR implementations
        shell: bash
        run: |
          mkdir -p benchmark-results
          cargo bench --bench implied_black_vol_paths --features "${{ matrix.features }}" \
            --no-run --message-format=json > benchmark-results/build.jsonl
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = [json.loads(line) for line in Path("benchmark-results/build.jsonl").read_text().splitlines()]
          executables = [item["executable"] for item in artifacts
                         if item.get("reason") == "compiler-artifact"
                         and item["target"]["name"] == "implied_black_vol_paths"
                         and item.get("executable")]
          if len(executables) != 1:
              raise RuntimeError(f"expected one benchmark executable, got {executables}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SOLVER_BENCHMARK={Path(executables[0]).resolve()}\n")
          PY
          rustc -vV > benchmark-results/rustc.txt
          c++ --version > benchmark-results/cxx.txt
          lscpu > benchmark-results/cpu.txt
      - name: Compare identical seeded workloads
        shell: bash
        run: |
          python3 -m unittest discover -s benches -p test_compare_solvers.py
          python3 benches/compare_solvers.py "$SOLVER_BENCHMARK" \
            --iterations 200000 --rounds 2 --blocks 6 \
            --features "${{ matrix.features }}" --flags "$RUSTFLAGS" \
            --output benchmark-results/solvers.json \
            --summary benchmark-results/solvers.md
          cat benchmark-results/solvers.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save solver measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-lbr-${{ matrix.mode }}
          path: benchmark-results/

  volfi-rounding-study:
    name: High-precision volfi approximation decomposition (temporary)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/volfi-book-prototype-20261107'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decompose represented chart approximation error with Decimal
        run: |
          mkdir -p rounding-results
          tar -czf rounding-results/analysis-source.tar.gz src/volfi_book.rs src/volfi_book/tables.rs tests/experimental_adaptive_seeds.rs scripts/study_volfi_rounding.py
          VOLFI_TRACE=1 cargo test --features volfi_book --test experimental_adaptive_seeds volfi_book_dump_direct_oracle_rows -- --nocapture > rounding-results/runtime.txt 2>&1
          python3 scripts/study_volfi_rounding.py --rust-outputs rounding-results/runtime.txt --output rounding-results/analysis.json > rounding-results/summary.txt
          cargo test --features volfi_book --test experimental_adaptive_seeds volfi_book_rsqrt_independent_reference_seams -- --nocapture > rounding-results/rsqrt-test.txt 2>&1
          grep 'VOLFI_RSQRT_ORACLE' rounding-results/rsqrt-test.txt >> "$GITHUB_STEP_SUMMARY"
          cargo test --features volfi_book --test experimental_adaptive_seeds volfi_book_compensated_independent_reference_seams -- --nocapture > rounding-results/compensated-test.txt 2>&1
          grep 'VOLFI_COMPENSATED_ORACLE' rounding-results/compensated-test.txt >> "$GITHUB_STEP_SUMMARY"
          cargo test --features volfi_book --test experimental_adaptive_seeds volfi_book_selective_independent_reference_seams -- --nocapture > rounding-results/selective-test.txt 2>&1
          grep 'VOLFI_SELECTIVE_ORACLE' rounding-results/selective-test.txt >> "$GITHUB_STEP_SUMMARY"
          cargo test --features volfi_book --test experimental_adaptive_seeds volfi_book_endpoint_independent_reference_seams -- --nocapture > rounding-results/endpoint-test.txt 2>&1
          grep 'VOLFI_ENDPOINT_ORACLE' rounding-results/endpoint-test.txt >> "$GITHUB_STEP_SUMMARY"
          cargo test --features volfi_book --test experimental_adaptive_seeds volfi_book_extended_b_independent_reference_seams -- --nocapture > rounding-results/extra-b-test.txt 2>&1
          grep 'VOLFI_EXTRA_B_ORACLE' rounding-results/extra-b-test.txt >> "$GITHUB_STEP_SUMMARY"
          cargo test --features volfi_book --test experimental_adaptive_seeds volfi_book_b17_final_independent_reference_seams -- --nocapture > rounding-results/b17-final-test.txt 2>&1
          grep 'VOLFI_B17_FINAL_ORACLE' rounding-results/b17-final-test.txt >> "$GITHUB_STEP_SUMMARY"

          cat rounding-results/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volfi-rounding-study
          path: rounding-results/

  volfi-rsqrt-study:
    name: Volfi inverse-sqrt correction paired A/B (temporary)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/volfi-book-prototype-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTFLAGS: -C target-cpu=native -C target-feature=+fma
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build optimized common benchmark executable
        run: |
          mkdir -p rsqrt-results
          cargo bench --bench volfi_compare --features volfi_book --no-run --message-format=json > rsqrt-results/build.jsonl
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          entries = [json.loads(s) for s in Path("rsqrt-results/build.jsonl").read_text().splitlines()]
          paths = [x["executable"] for x in entries if x.get("reason")=="compiler-artifact"
                   and x["target"]["name"]=="volfi_compare" and x.get("executable")]
          if len(paths)!=1: raise RuntimeError(paths)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("VOLFI_BENCH="+str(Path(paths[0]).resolve())+"\n")
          PY
          rustc -vV > rsqrt-results/rustc.txt
          lscpu > rsqrt-results/cpu.txt
      - name: Compare current solver to correction on same population
        run: |
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference volfi-book --candidate volfi-rsqrt \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/paired.json > rsqrt-results/summary.md
          cat rsqrt-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference volfi-book --candidate volfi-compensated \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/compensated.json > rsqrt-results/compensated.md
          cat rsqrt-results/compensated.md >> "$GITHUB_STEP_SUMMARY"
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference volfi-book --candidate volfi-selective \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/selective.json > rsqrt-results/selective.md
          cat rsqrt-results/selective.md >> "$GITHUB_STEP_SUMMARY"
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference volfi-book --candidate volfi-endpoint \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/endpoint.json > rsqrt-results/endpoint.md
          cat rsqrt-results/endpoint.md >> "$GITHUB_STEP_SUMMARY"
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference experimental --candidate volfi-endpoint \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/endpoint-vs-experimental.json > rsqrt-results/endpoint-vs-experimental.md
          cat rsqrt-results/endpoint-vs-experimental.md >> "$GITHUB_STEP_SUMMARY"
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference volfi-endpoint --candidate volfi-b17 \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/b17.json > rsqrt-results/b17.md
          cat rsqrt-results/b17.md >> "$GITHUB_STEP_SUMMARY"
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference volfi-endpoint --candidate volfi-b18 \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/b18.json > rsqrt-results/b18.md
          cat rsqrt-results/b18.md >> "$GITHUB_STEP_SUMMARY"
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference volfi-b17 --candidate volfi-b17-final \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/b17-final.json > rsqrt-results/b17-final.md
          cat rsqrt-results/b17-final.md >> "$GITHUB_STEP_SUMMARY"
          python3 benches/compare_volfi.py "$VOLFI_BENCH" --reference experimental --candidate volfi-b17-final \
            --iterations 150000 --rounds 2 --blocks 4 \
            --features volfi_book --flags "$RUSTFLAGS" \
            --output rsqrt-results/b17-final-vs-experimental.json > rsqrt-results/b17-final-vs-experimental.md
          cat rsqrt-results/b17-final-vs-experimental.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volfi-rsqrt-study
          path: rsqrt-results/

  volfi-generated-oracle:
    name: Independent mpmath chart-domain stress (temporary)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/volfi-book-prototype-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate exact-binary64 high-precision roots
        run: |
          python3 -m venv /tmp/volfi-stress-venv
          /tmp/volfi-stress-venv/bin/pip install mpmath==1.3.0
          mkdir -p stress-results
          /tmp/volfi-stress-venv/bin/python scripts/volfi_book_stress.py \
            --output stress-results/inputs.tsv > stress-results/generator.txt
      - name: Evaluate actual optimized Rust implementation
        env:
          RUSTFLAGS: -C target-cpu=native -C target-feature=+fma
        run: |
          cargo run --release --example volfi_book_stress --features volfi_book \
            < stress-results/inputs.tsv > stress-results/summary.txt
          cat stress-results/summary.txt >> "$GITHUB_STEP_SUMMARY"
          cat stress-results/generator.txt >> "$GITHUB_STEP_SUMMARY"
          rustc -vV > stress-results/rustc.txt
          lscpu > stress-results/cpu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volfi-generated-oracle
          path: stress-results/
