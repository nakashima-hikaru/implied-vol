name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: base
            features: cxx_bench
          - mode: base-fma
            features: fma,cxx_bench
          - mode: flashiv
            features: flashiv,cxx_bench
          - mode: flashiv-fma
            features: flashiv,fma,cxx_bench
          - mode: experimental
            features: experimental,cxx_bench
          - mode: experimental-fma
            features: experimental,fma,cxx_bench
          - mode: combined
            features: flashiv,experimental,cxx_bench
          - mode: combined-fma
            features: flashiv,experimental,fma,cxx_bench
    name: Test ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install nextest
        shell: bash
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - run: cargo fmt --all --check
      - run: cargo check --workspace --features "${{ matrix.features }}"
      - run: cargo clippy --features "${{ matrix.features }}" -- -D warnings
      - run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo test --features "${{ matrix.features }}" --doc -- --show-output
      - run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo nextest run --features "${{ matrix.features }}"

  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Run benchmarks
        run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo +nightly bench --features cxx_bench
        env:
          RUSTFLAGS: --cfg=bench

      - name: Run benchmarks with FMA
        run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo +nightly bench --features fma,cxx_bench
        env:
          RUSTFLAGS: --cfg=bench

  hybrid-benchmarks:
    name: Compare Hybrid with LBR (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: crate-fma-off
            features: cxx_bench
          - mode: crate-fma-on
            features: fma,cxx_bench
    env:
      RUSTFLAGS: -C target-cpu=native -C target-feature=+fma
      CARGO_TARGET_DIR: target/solver-comparison
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Hybrid and LBR implementations
        shell: bash
        run: |
          mkdir -p benchmark-results
          cargo bench --bench implied_black_vol_paths --features "${{ matrix.features }}" \
            --no-run --message-format=json > benchmark-results/build.jsonl
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = [json.loads(line) for line in Path("benchmark-results/build.jsonl").read_text().splitlines()]
          executables = [item["executable"] for item in artifacts
                         if item.get("reason") == "compiler-artifact"
                         and item["target"]["name"] == "implied_black_vol_paths"
                         and item.get("executable")]
          if len(executables) != 1:
              raise RuntimeError(f"expected one benchmark executable, got {executables}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SOLVER_BENCHMARK={Path(executables[0]).resolve()}\n")
          PY
          rustc -vV > benchmark-results/rustc.txt
          c++ --version > benchmark-results/cxx.txt
          lscpu > benchmark-results/cpu.txt
      - name: Compare identical seeded workloads
        shell: bash
        run: |
          python3 -m unittest discover -s benches -p test_compare_solvers.py
          python3 benches/compare_solvers.py "$SOLVER_BENCHMARK" \
            --iterations 200000 --rounds 2 --blocks 6 \
            --features "${{ matrix.features }}" --flags "$RUSTFLAGS" \
            --output benchmark-results/solvers.json \
            --summary benchmark-results/solvers.md
          cat benchmark-results/solvers.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save solver measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-lbr-${{ matrix.mode }}
          path: benchmark-results/

  rank3-perf:
    name: Experimental rank-three paired A/B (temporary)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/experimental-rank3-simd-packing-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTFLAGS: -C target-cpu=native -C target-feature=+fma
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fcd44963881830e8a07596da1d7c117e0792e901
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Use exactly the same benchmark harness
        run: cp candidate/benches/implied_black_vol_paths.rs baseline/benches/implied_black_vol_paths.rs
      - name: Build both benchmark executables
        shell: bash
        run: |
          mkdir -p results
          CARGO_TARGET_DIR="$PWD/target-base" cargo bench --manifest-path baseline/Cargo.toml --bench implied_black_vol_paths --features experimental --no-run --message-format=json > results/baseline.jsonl
          CARGO_TARGET_DIR="$PWD/target-new" cargo bench --manifest-path candidate/Cargo.toml --bench implied_black_vol_paths --features experimental --no-run --message-format=json > results/candidate.jsonl
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          for label in ("baseline", "candidate"):
              artifacts = (json.loads(line) for line in Path(f"results/{label}.jsonl").read_text().splitlines())
              exes = [item["executable"] for item in artifacts if item.get("reason") == "compiler-artifact"
                      and item["target"]["name"] == "implied_black_vol_paths" and item.get("executable")]
              if len(exes) != 1:
                  raise RuntimeError(f"expected one {label} executable, got {exes}")
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write(f"{label.upper()}_BENCH={Path(exes[0]).resolve()}\\n")
          PY
          rustc -vV > results/rustc.txt
          lscpu > results/cpu.txt
      - name: Run rotating ABBA/BAAB comparison
        shell: bash
        run: |
          python3 -m unittest discover -s candidate/benches -p test_compare_experimental.py
          python3 candidate/benches/compare_experimental.py "$BASELINE_BENCH" "$CANDIDATE_BENCH" --iterations 100000 --rounds 2 --blocks 4 --features experimental --flags "$RUSTFLAGS" --output results/rank3.json > results/summary.txt
          cat results/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Save paired samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-rank3-paired
          path: results/
