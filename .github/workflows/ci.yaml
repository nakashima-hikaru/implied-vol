name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: base
            features: cxx_bench
          - mode: base-fma
            features: fma,cxx_bench
          - mode: flashiv
            features: flashiv,cxx_bench
          - mode: flashiv-fma
            features: flashiv,fma,cxx_bench
          - mode: experimental
            features: experimental,cxx_bench
          - mode: experimental-fma
            features: experimental,fma,cxx_bench
          - mode: combined
            features: flashiv,experimental,cxx_bench
          - mode: combined-fma
            features: flashiv,experimental,fma,cxx_bench
    name: Test ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install nextest
        shell: bash
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - run: cargo fmt --all --check
      - name: Verify Experimental finite-precision transfer obligations
        if: contains(matrix.features, 'experimental')
        shell: bash
        run: |
          python3 scripts/verify_finish_scalar_bridge.py
          python3 scripts/verify_finish_transfer.py --samples 80000
          python3 scripts/replay_finish_certificate.py --help >/dev/null
      - run: cargo check --workspace --features "${{ matrix.features }}"
      - run: cargo clippy --features "${{ matrix.features }}" -- -D warnings
      - run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo test --features "${{ matrix.features }}" --doc -- --show-output
      - run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo nextest run --features "${{ matrix.features }}"

  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Run benchmarks
        run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo +nightly bench --features cxx_bench
        env:
          RUSTFLAGS: --cfg=bench

      - name: Run benchmarks with FMA
        run: RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" cargo +nightly bench --features fma,cxx_bench
        env:
          RUSTFLAGS: --cfg=bench

  hybrid-benchmarks:
    name: Compare Hybrid with LBR (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: crate-fma-off
            features: cxx_bench
          - mode: crate-fma-on
            features: fma,cxx_bench
    env:
      RUSTFLAGS: -C target-cpu=native -C target-feature=+fma
      CARGO_TARGET_DIR: target/solver-comparison
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Hybrid and LBR implementations
        shell: bash
        run: |
          mkdir -p benchmark-results
          cargo bench --bench implied_black_vol_paths --features "${{ matrix.features }}" \
            --no-run --message-format=json > benchmark-results/build.jsonl
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = [json.loads(line) for line in Path("benchmark-results/build.jsonl").read_text().splitlines()]
          executables = [item["executable"] for item in artifacts
                         if item.get("reason") == "compiler-artifact"
                         and item["target"]["name"] == "implied_black_vol_paths"
                         and item.get("executable")]
          if len(executables) != 1:
              raise RuntimeError(f"expected one benchmark executable, got {executables}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SOLVER_BENCHMARK={Path(executables[0]).resolve()}\n")
          PY
          rustc -vV > benchmark-results/rustc.txt
          c++ --version > benchmark-results/cxx.txt
          lscpu > benchmark-results/cpu.txt
      - name: Compare identical seeded workloads
        shell: bash
        run: |
          python3 -m unittest discover -s benches -p test_compare_solvers.py
          python3 benches/compare_solvers.py "$SOLVER_BENCHMARK" \
            --iterations 200000 --rounds 2 --blocks 6 \
            --features "${{ matrix.features }}" --flags "$RUSTFLAGS" \
            --output benchmark-results/solvers.json \
            --summary benchmark-results/solvers.md
          cat benchmark-results/solvers.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save solver measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-lbr-${{ matrix.mode }}
          path: benchmark-results/

  experimental-bit-identity:
    name: Pinned Experimental full-output bit identity (temporary)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/experimental-compensated-finish-cost-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTFLAGS: -C target-cpu=native -C target-feature=+fma
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6bb0c1313ac4dc3a23e18ac4752ac21fc87e46f
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile same input/serialization harness against both versions
        shell: bash
        run: |
          mkdir -p identity-results baseline/examples
          cp candidate/examples/experimental_bits.rs baseline/examples/experimental_bits.rs
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-bit-baseline" cargo run \
            --release --manifest-path baseline/Cargo.toml --features experimental \
            --example experimental_bits --quiet > identity-results/baseline.txt
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-bit-candidate" cargo run \
            --release --manifest-path candidate/Cargo.toml --features experimental \
            --example experimental_bits --quiet > identity-results/candidate.txt
          if ! cmp identity-results/baseline.txt identity-results/candidate.txt; then
            diff -u identity-results/baseline.txt identity-results/candidate.txt \
              | head -100 > identity-results/first-differences.txt || true
            echo 'FAILED: source-precise Experimental output mismatch'
            cat identity-results/first-differences.txt
            exit 1
          fi
          wc -l identity-results/baseline.txt > identity-results/case-count.txt
          sha256sum identity-results/*.txt > identity-results/hashes.txt
          rustc -vV > identity-results/rustc.txt
          lscpu > identity-results/cpu.txt
          printf '%s\n' 'Pinned main vs candidate: exact output files match for 131072 prepared values' \
            >> "$GITHUB_STEP_SUMMARY"
          cat identity-results/case-count.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-bit-identity
          path: identity-results/
